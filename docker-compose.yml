version: "3.8"

services:

  api:
    build: .
    container_name: tasks-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:Admin1234@db:5432/postgres
    depends_on:
      - db


  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
